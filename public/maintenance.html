<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Orbit is down for maintenance</title>
<meta name="description" content="Orbit is temporarily down for maintenance. We will be back shortly." />

<!--
  Standalone maintenance page.

  Deliberately not part of the app. vercel.json rewrites every route here, so
  during maintenance the React bundle is never requested at all: no Firebase
  SDK download, no auth listener, no Firestore connection. That is a stronger
  guarantee than the in-app gate in main.jsx, which still has to ship and boot
  the application before it can decide to hide it.

  No build step, no framework, no external requests. One file that renders
  even if everything else in the project is broken -- which is the state you
  are most likely to be in when this page is up.

  To take the site out of maintenance: remove the maintenance rewrite from
  vercel.json (the block is marked) and redeploy.
-->

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: dark;
    --bg: #0a0a0b;
    --ink: #f4f4f5;
    --ink-2: #a1a1a6;
    --ink-3: #6b6b73;
    --line: rgba(255, 255, 255, 0.08);
  }

  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    /* System stack only. A webfont here would be one more request that can
       fail on the page whose whole job is not failing. */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }

  .wrap { max-width: 440px; text-align: center; }

  .mark {
    display: grid;
    place-items: center;
    width: 60px;
    height: 60px;
    margin: 0 auto 26px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid var(--line);
  }

  /* A slow orbit, because the logo is one. Reduced-motion stops it below. */
  .mark svg { animation: spin 14s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.022em;
    line-height: 1.25;
  }

  p.lead { font-size: 15.5px; color: var(--ink-2); margin-top: 14px; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 26px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #e3ae55;
    box-shadow: 0 0 0 3px rgba(227, 174, 85, 0.16);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }

  p.contact { font-size: 13.5px; color: var(--ink-3); margin-top: 30px; }

  a {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--ink-3);
  }
  a:hover { text-decoration-color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .mark svg, .dot { animation: none; }
  }

  @media (max-width: 420px) {
    h1 { font-size: 23px; }
    p.lead { font-size: 15px; }
  }
</style>
</head>

<body>
  <main class="wrap">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#f4f4f5"
           stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <circle cx="19" cy="5" r="2" />
        <circle cx="5" cy="19" r="2" />
        <path d="M10.4 21.9a10 10 0 0 0 9.941-15.416" />
        <path d="M13.5 2.1a10 10 0 0 0-9.841 15.416" />
      </svg>
    </span>

    <h1>Orbit is down for maintenance</h1>

    <p class="lead">
      We are making some changes and will be back shortly. Sign-in is switched
      off in the meantime, and nothing you have posted is affected.
    </p>

    <span class="status">
      <span class="dot" aria-hidden="true"></span>
      Work in progress
    </span>

    <p class="contact">
      Need something urgently?
      <a href="mailto:team.orbit@gmail.com">team.orbit@gmail.com</a>
    </p>
  </main>
</body>
</html>
